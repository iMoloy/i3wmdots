[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini

[color]
bg = #1f162b
bg-alt = #1f162b
fg = #f8f8f2
mb = #2b1e3d
trans = #001f162b

red = #ff5555
pink = #d95d95
purple = #ff79c6
blue = #bd93f9
blue-arch = #0A9CF5
cyan = #8be9fd
teal = #00B19F
green = #50fa7b
lime = #B9C244
yellow = #f1fa8c
amber = #FBC02D
orange = #E57C46
brown = #AC8476
grey = #2b1e3d
indigo = #6C77BB
blue-gray = #63778f


[bar/dracula]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = true

width = 100%
height = 18pt

offset-x = 0pt
offset-y = 0pt

background = ${color.trans}
foreground = ${color.fg}

radius = 0pt

line-size = 2
line-color = ${color.blue}

border-top = 2pt
border-color = ${color.grey}

padding = 0pt

module-margin-left = 0pt
module-margin-right = 0pt

; Text
font-0 = "JetBrainsMono:style=Bold:size=9;2"
; Icons
font-1 = "Font Awesome 6 Free Solid:size=9;2"
font-2 = "Material Design Icons Desktop:size=11;2"
font-3 = "Material Design Icons Desktop:size=13;3"
; Glyphs
font-4 = "MesloLGS NF:style=Regular:size=16;3"
;dpi = 96

;Modules availables but not active:
;	brightness		xkeyboard
modules-left = sep launcher sep sep i3 sep sep mpd_control sep bdgg sept title
modules-center = date sept weather
modules-right = tray bdv colorpicker usercard sep bluetooth sep sep battery sep sep cpu_bar sep sep memory_bar sep sep filesystem sep sep network sep sep pulseaudio sep sep updates sep sep power sep

separator =
dim-value = 1.0

;;locale = es_MX.UTF-8

wm-restack = i3
enable-ipc = true

cursor-click = pointer
cursor-scroll = ns-resize

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
